services:
  grading-pipeline:
    build: .
    image: grading-pipeline:latest
    container_name: grading-pipeline
    # Bound to loopback: the sidecar holds Canvas and model credentials and
    # has no login of its own. Never publish it on 0.0.0.0.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # Database, secrets, and collected workspaces live here and survive
      # image rebuilds and container removal.
      - grading-data:/data
    restart: unless-stopped
    environment:
      # Credentials. In the browser UI they can also be saved on the Setup
      # step; env vars are the headless/Docker route and take precedence.
      # Copy the values into a .env file next to this compose file, or
      # export them before `docker compose up`. Free OpenRouter models
      # work without a key.
      GRADING_PIPELINE_CANVAS_BASE_URL: ${GRADING_PIPELINE_CANVAS_BASE_URL:-}
      GRADING_PIPELINE_CANVAS_API_TOKEN: ${GRADING_PIPELINE_CANVAS_API_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

volumes:
  grading-data:
