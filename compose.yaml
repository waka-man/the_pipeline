services:
  grading-pipeline:
    build: .
    image: grading-pipeline:latest
    container_name: grading-pipeline
    # Bound to loopback: the sidecar holds Canvas and model credentials and
    # has no login of its own. Never publish it on 0.0.0.0.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # The desktop app's data directory. It holds the database with the
      # saved sessions, the Canvas settings, the rendered reports and the
      # opencode sessions, so sharing it is what lets this version pick up a
      # session the installed app started, and the other way round.
      #
      # The default is the Linux path. macOS keeps it in
      #   ~/Library/Application Support/Grading Pipeline
      # and Windows in the AppData\Roaming\Grading Pipeline folder.
      # Set GRADING_PIPELINE_HOST_DATA in .env for those two.
      - type: bind
        source: ${GRADING_PIPELINE_HOST_DATA:-~/.config/Grading Pipeline}
        target: /data
      # The workspace, mounted at the very same absolute path it has on the
      # host. The database records absolute paths to the collected
      # submissions and the rendered reports, so both versions have to agree
      # on where those are.
      - type: bind
        source: ${GRADING_PIPELINE_HOST_WORKSPACE:-${HOME}/grading-pipeline-workspace}
        target: ${GRADING_PIPELINE_HOST_WORKSPACE:-${HOME}/grading-pipeline-workspace}
      # The person's own opencode store. The accounts they signed into live
      # there — a Go subscription, GitHub Copilot — and with them the models
      # they pay for.
      - type: bind
        source: ${GRADING_PIPELINE_HOST_OPENCODE:-~/.local/share/opencode}
        target: /host-opencode/opencode
      # And the opencode configuration, which is where a provider the person
      # added themselves is defined.
      - type: bind
        source: ${GRADING_PIPELINE_HOST_OPENCODE_CONFIG:-~/.config/opencode}
        target: /host-config/opencode
    restart: unless-stopped
    environment:
      # Where the collected submissions and reports are written. The same
      # path as on the host, for the reason given above.
      GRADING_PIPELINE_WORKSPACE: ${GRADING_PIPELINE_HOST_WORKSPACE:-${HOME}/grading-pipeline-workspace}
      # The opencode runtime is a platform binary and stays in the container:
      # the one the desktop app downloaded is not the one this container can
      # run.
      GRADING_PIPELINE_RUNTIME_HOME: /runtime
      # The store of the person using the app, mounted above. The accounts
      # they signed into are copied out of it into the store below.
      XDG_DATA_HOME: /host-opencode
      XDG_CONFIG_HOME: /host-config
      # opencode's own store, inside the container. It is never the one the
      # desktop app is using: two opencode processes on one database is what
      # breaks on Windows.
      GRADING_PIPELINE_OPENCODE_HOME: /runtime/opencode-home
      # Credentials. In the browser UI they can also be saved on the Setup
      # step; env vars are the headless/Docker route and are used when
      # nothing is saved yet. Copy the values into a .env file next to this
      # compose file, or export them before `docker compose up`. Free
      # OpenRouter models work without a key.
      #
      # A Canvas token saved by the desktop app lives in the OS keychain,
      # which a container cannot reach. When the host has no keychain the
      # token is in the shared secrets.json and is picked up as it is; when
      # it does, put the token here.
      GRADING_PIPELINE_CANVAS_BASE_URL: ${GRADING_PIPELINE_CANVAS_BASE_URL:-}
      GRADING_PIPELINE_CANVAS_API_TOKEN: ${GRADING_PIPELINE_CANVAS_API_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
