name: release

# Tagged pushes build installables. Unsigned for now; see the signing section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # PyInstaller cannot cross-compile, so the sidecar is frozen once per OS and
  # handed to electron-builder on that same runner.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win
          - os: ubuntu-latest
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          npm --prefix apps/desktop ci

      # Proves the frozen binary runs on this OS before it is wrapped. The
      # commonest packaging failure is a binary that imports fine and then dies
      # on its first real call, which no amount of local testing catches.
      - name: Freeze and smoke-test the sidecar
        run: python scripts/build_sidecar.py

      - name: Build installables
        working-directory: apps/desktop
        env:
          # Signing is opt-in. With no certificate the build still produces a
          # usable artifact, so an unsigned release never blocks on secrets.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
            echo "CSC_LINK=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          fi
          npx electron-builder --publish never

      # A run with no tag should not attempt to attach to a release.
      - name: Collect artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/*

  # Once signing credentials exist, macOS additionally needs notarization or
  # Gatekeeper refuses the app even when it is correctly signed. Kept separate
  # because it needs a privileged step that should not run in every build.
  notarize:
    name: notarize (macOS)
    if: startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID != ''
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the signed and notarized dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pip install pyinstaller
          npm --prefix apps/desktop ci
          python scripts/build_sidecar.py
          cd apps/desktop
          npx electron-builder --mac dmg --publish never
      - name: Submit for notarization
        run: |
          pip install notarytool
          xcrun notarytool submit "dist/*.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
