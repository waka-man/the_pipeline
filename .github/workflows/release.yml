name: release

# Tagged pushes build installables. Unsigned for now; see the signing section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Which target to build. macOS costs 10x a Linux minute, so building one platform is much cheaper than all four."
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - mac-arm64
          - mac-x64

permissions:
  contents: write

jobs:
  # Chooses the matrix. Exists so a single target can be rebuilt without paying
  # for four: macOS minutes are charged at 10x, so "just give me Windows" is a
  # quarter of the cost of the whole release.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.platform || 'all' }}
        run: |
          set -euo pipefail
          full='[
            {"os":"macos-latest","label":"mac arm64","key":"mac-arm64"},
            {"os":"macos-15-intel","label":"mac x64","key":"mac-x64"},
            {"os":"windows-latest","label":"win x64","key":"windows"},
            {"os":"ubuntu-latest","label":"linux x64","key":"linux"}
          ]'
          if [ "$WANT" = "all" ]; then
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
          else
            picked=$(printf '%s' "$full" | python3 -c "import json,sys; k=sys.argv[1]; print(json.dumps([e for e in json.load(sys.stdin) if e['key']==k]))" "$WANT")
            echo "matrix=$picked" >> "$GITHUB_OUTPUT"
          fi
          echo "building: $WANT"

  # PyInstaller cannot cross-compile, so the sidecar is frozen once per OS and
  # handed to electron-builder on that same runner. That constraint is also why
  # macOS appears twice: each architecture needs its own frozen sidecar, so an
  # x64 build has to happen on an Intel runner rather than by passing --x64.
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          npm --prefix apps/desktop ci

      # Proves the frozen binary runs on this OS before it is wrapped. The
      # commonest packaging failure is a binary that imports fine and then dies
      # on its first real call, which no amount of local testing catches.
      - name: Freeze and smoke-test the sidecar
        run: python scripts/build_sidecar.py

      # Ships opencode with the app so nobody has to install and authenticate
      # it separately. The npm package always names its payload opencode.exe
      # even when it is an ELF or Mach-O binary, so it is renamed here. Its
      # postinstall fetches the build for whichever runner is doing the install,
      # which is why this cannot be done once and shared across the matrix.
      #
      # Required, not best effort. A release without it ships an app that
      # demands a separate opencode install, which is the whole thing this
      # bundle exists to remove. electron-builder silently skips a missing
      # resources/opencode, so nothing downstream would catch it.
      - name: Fetch opencode
        id: opencode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/resources/opencode
          name=opencode
          [ "$RUNNER_OS" = "Windows" ] && name=opencode.exe
          dest="apps/desktop/resources/opencode/$name"
          bin="$RUNNER_TEMP/oc/node_modules/opencode-ai/bin"
          if npm install --prefix "$RUNNER_TEMP/oc" --no-audit --no-fund \
               "opencode-ai@${OPENCODE_VERSION}"; then
            # find rather than ls: the payload's name is not guaranteed to be
            # tidy, and this is the one place a shell glob would bite.
            src=$(find "$bin" -maxdepth 1 -type f | head -1)
            if [ -z "$src" ]; then
              echo "::error::opencode-ai installed but shipped no binary"
              exit 1
            fi
            cp "$src" "$dest"
            chmod +x "$dest"
            echo "bundled $(basename "$src") as $name ($(du -h "$dest" | cut -f1))"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not fetch opencode; refusing to publish a release that needs a separate install"
            exit 1
          fi
        env:
          OPENCODE_VERSION: "1.18.35"

      - name: Smoke-test the bundled opencode
        if: steps.opencode.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          name=opencode
          [ "$RUNNER_OS" = "Windows" ] && name=opencode.exe
          "apps/desktop/resources/opencode/$name" --version

      # Signing is opt-in, and the opt-in cannot be expressed in a step `env:`
      # block. GitHub renders an absent secret as an empty string rather than
      # leaving it unset, and electron-builder reads an empty CSC_LINK as a
      # certificate *file path*: it resolves "" against the working directory
      # and aborts with "<cwd> not a file". So a plain
      # `CSC_LINK: ${{ secrets.X }}` fails the build precisely when you have no
      # certificate yet, which is the case this workflow is designed to support.
      #
      # The names are therefore only written to $GITHUB_ENV when the secret is
      # present, leaving them genuinely unset otherwise.
      - name: Configure code signing
        shell: bash
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Stops electron-builder probing the keychain on runners that have
          # none, and keeps unsigned builds ad-hoc signed.
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          if [ -n "$CERT_PFX_BASE64" ]; then
            pfx="$RUNNER_TEMP/cert.pfx"
            printf '%s' "$CERT_PFX_BASE64" | base64 --decode > "$pfx"
            {
              echo "CSC_LINK=$pfx"
              echo "CSC_KEY_PASSWORD=$CERT_PFX_PASSWORD"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            } >> "$GITHUB_ENV"
            echo "code signing: certificate found, artifacts will be signed"
          else
            echo "code signing: no certificate, building unsigned"
          fi

      - name: Build installables
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --publish never

      # A run with no tag should not attempt to attach to a release.
      - name: Collect artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Only the installers. builder-debug.yml is a build log and the
          # blockmap/latest*.yml files are electron-updater metadata, which is
          # inert here because the app ships no updater.
          files: |
            apps/desktop/dist/*
            !apps/desktop/dist/builder-debug.yml
            !apps/desktop/dist/*.blockmap
            !apps/desktop/dist/latest*.yml

  # Once signing credentials exist, macOS additionally needs notarization or
  # Gatekeeper refuses the app even when it is correctly signed. Kept separate
  # because it needs a privileged step that should not run in every build.
  #
  # The gate reads a repository *variable*, not a secret: the secrets context is
  # not available in a job-level `if:`. Set APPLE_NOTARIZE=true plus the three
  # APPLE_* secrets to enable it.
  notarize:
    name: notarize (macOS)
    if: startsWith(github.ref, 'refs/tags/') && vars.APPLE_NOTARIZE == 'true'
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the signed and notarized dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pip install pyinstaller
          npm --prefix apps/desktop ci
          python scripts/build_sidecar.py
          mkdir -p apps/desktop/resources/opencode
          npm install --prefix "$RUNNER_TEMP/oc" --no-audit --no-fund opencode-ai@1.18.35
          cp "$RUNNER_TEMP/oc/node_modules/opencode-ai/bin/"* \
             apps/desktop/resources/opencode/opencode
          chmod +x apps/desktop/resources/opencode/opencode
          cd apps/desktop
          npx electron-builder --mac dmg --publish never
      - name: Submit for notarization
        run: |
          pip install notarytool
          xcrun notarytool submit "dist/*.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
