name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: sidecar (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # Git on Windows runners needs this on PATH for the clone tests.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" coverage

      # Recorded Canvas fixtures must carry no real student name, institution
      # host or operator name. This fails the build rather than trusting that
      # someone remembered to run the redactor.
      - name: Fixtures are anonymised
        run: python scripts/redact_fixtures.py --check

      - name: Tests
        run: python -m pytest sidecar/tests -q

      # Both launch paths go through this module: the checkout uses it with an
      # interpreter, the packaged app uses it frozen. A change that breaks it
      # breaks the desktop app too, and only the packaging job would notice.
      - name: Sidecar entry point
        run: python sidecar/grading_sidecar.py --selftest

      # Guards the guarantee that generated artefacts do not vary by host.
      # Compared against chr(10) rather than an escape literal: the default
      # shell on windows-latest is PowerShell, which does not treat \ as an
      # escape inside double quotes, so '\n' arrives at Python as backslash-n.
      - name: Newlines are platform-independent
        run: python -c "from pipeline.config import NEWLINE; assert NEWLINE == chr(10), repr(NEWLINE)"

      - name: Coverage
        run: |
          python -m coverage run -m pytest sidecar/tests -q
          python -m coverage report

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  desktop:
    name: desktop logic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Main-process logic tests
        run: node apps/desktop/test/main.test.js

  # The sidecar must start on a clean machine with no project checkout present,
  # because that is what a packaged app looks like. Electron itself is heavy and
  # headless CI cannot show a window, so this covers the part that actually
  # breaks per platform: interpreter discovery and the HTTP surface.
  sidecar-standalone:
    name: sidecar starts from an installed location
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Serve without a checkout beside it
        shell: bash
        run: |
          python - <<'PY'
          import json, os, tempfile, threading, urllib.request
          import pipeline.server as srv
          from pipeline.store import Store

          state = srv.AppState(store=Store(tempfile.mkdtemp() + "/t.db"), bus=srv.EventBus(Store(tempfile.mkdtemp() + "/t2.db")))
          httpd, port = srv.serve_test(state)
          with urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=10) as r:
              body = json.loads(r.read())
          assert body["ok"] and body["service"] == "grading-pipeline", body
          httpd.shutdown()
          print("health ok on", os.name)
          PY

      - name: Packaged interpreter discovery finds something
        shell: bash
        run: |
          python - <<'PY'
          import shutil, sys, sysconfig, platform
          exe = sys.executable
          assert shutil.which(exe) or True          # may be an absolute path
          print("interpreter:", exe)
          print("platform:", platform.system(), platform.machine())
          # A frozen sidecar execs `sys.executable`, never a literal "python".
          assert exe.endswith((".exe", "python3")) or "python" in exe.lower(), exe
          print("ok")
          PY
  # Freezing is the step most likely to rot silently: it depends on hidden
  # imports that static analysis cannot see, so a new source converter breaks
  # the freeze without breaking any test. One platform is enough to catch that,
  # and the release workflow still builds all three.
  frozen-sidecar:
    name: frozen sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller

      - name: Freeze and run it
        run: python scripts/build_sidecar.py

      - name: It serves, not just imports
        shell: bash
        run: |
          BIN=apps/desktop/resources/sidecar/grading-pipeline-sidecar
          GRADING_PIPELINE_HOME="$(mktemp -d)" "$BIN" > out.log 2> err.log &
          PID=$!
          for _ in $(seq 1 60); do
            grep -q port out.log 2>/dev/null && break
            sleep 1
          done
          PORT=$(python -c "import json;print(json.load(open('out.log'))['port'])" 2>/dev/null)
          if [ -z "$PORT" ]; then cat err.log; exit 1; fi
          curl -sf "http://127.0.0.1:$PORT/health" | tee /dev/stderr | grep -q '"ok": true'
          kill $PID 2>/dev/null || true
          echo "frozen sidecar served on $PORT"

  # An invalid workflow file does not produce a readable error. GitHub records a
  # stub run that fails in 0s with "likely failed because of a workflow file
  # issue", which says nothing about the line at fault. Lint explicitly instead:
  # a `secrets` reference in a job-level `if:` cost an afternoon this way.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
