[project]
name = "grading-pipeline"
version = "0.1.12"
description = "Collect, grade, review and publish Canvas submissions with agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "html2text>=2024.2.26",
    # PyMuPDF 2.0 moved pymupdf4llm inside pymupdf and left the standalone
    # package as an empty shim that pulls in neither the converter nor fitz.
    # The 1.x pair is what this code and the PyInstaller hooks are tested
    # against; revisit together when adopting 2.x.
    "pymupdf4llm>=0.0.17,<2",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grading-pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["sidecar"]

[tool.pytest.ini_options]
testpaths = ["sidecar/tests"]